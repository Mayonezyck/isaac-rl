# Reward-aligned SceneFactory preset with vehicle collision punished as hard as
# road-edge collision.
#
# This keeps the curated32 + TTC/index setup, but sets direct vehicle collision
# penalty equal to the road-edge terminal penalty so both failure modes are
# treated with the same seriousness.
#
# This traced variant enables teleport-only resets after the first full
# initialization reset, so vehicles are moved between a parking area and the
# active spawn points instead of running the heavy reset path every episode.

env:
  num_envs: 4
  num_agents_per_env: 8
  observation_mode: "choco_reference"
  env_spacing: 240.0
  spawn_height_m: 1.2
  ground_mode: "plane"
  use_scene_factory_roads: true
  reset_mode: "teleport_only"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.05
  episode_length_s: 40.0
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  goal_reached_threshold_m: 3.0
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/multiworld_scene_curated_lane_safety_worldreset_32.yaml"
  world_index: 0
  world_selection_mode: "random_envs"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 200
  road_points_radius_m: 35.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: false
  neighbor_enable: true
  neighbor_k: 63
  neighbor_include_ttc: true
  neighbor_include_index: true
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

timing:
  step_log_enable: true
  step_print_enable: false
  step_print_every_n: 128
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 8.0
  lane_center_enable: false
  lane_forbidden_enable: true
  lane_forbidden_penalty: -20.0
  collision_penalty: -20.0
  crash_penalty: -20.0
  choco_offroad_penalty: -0.5
  choco_idle_penalty_enable: true
  choco_idle_penalty_per_step: 0.03
  choco_idle_speed_threshold_mps: 0.5
  choco_geom_lane_enable: true
  choco_geom_lane_per_step: 0.12
  choco_geom_lane_tolerance_m: 1.75
  choco_geom_lane_heading_weight: 0.8
  choco_geom_lane_min_alignment: 0.35
  choco_geom_offroad_enable: true
  choco_geom_offroad_lateral_threshold_m: 3.25
  choco_geom_offroad_distance_threshold_m: 6.0
  choco_ttc_penalty_enable: true
  choco_ttc_penalty_alpha: 0.15
  choco_ttc_penalty_max: 0.50
  choco_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_penalty_enable: true
  choco_road_edge_ttc_penalty_alpha: 0.10
  choco_road_edge_ttc_penalty_max: 0.60
  choco_road_edge_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_hard_min_ttc: 0.5
  choco_road_edge_ttc_radius_m: 40.0

policy:
  type: "late_fusion"
  ego_layers: [64, 64]
  road_layers: [96, 96]
  vehicle_layers: [96, 96]
  shared_layers: [128, 64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching_roads"
  run_name: "random4_curated32_agent_slots_goal3_late_fusion_obs_aligned_ttc_index_reward_aligned_collision_equal_roadedge_teleport_only_reset"
  shared_policy_mode: "agent_slots"
  max_iterations: 40000
  num_steps_per_env: 32
  save_interval: 25
  learning_rate: 3.0e-4
  num_learning_epochs: 5
  num_mini_batches: 4
  entropy_coef: 0.005
  clip_param: 0.2
  desired_kl: 0.01

app:
  device: "cuda:0"
  rl_device: "cuda:0"
  silence_runtime_warnings: true

sim:
  use_fabric: false
