# SceneFactory collision-test preset.
# Usage:
#   python -u -m src.train_student_vehicle_goal_multiagent_rsl_rl \
#     --config configs/scene_factory/collision_test.yaml \
#     --test_mode collision_test \
#     --headless
#
# Purpose:
# - launch one flat collision-test world
# - spawn two student vehicles in a deterministic head-on setup
# - drive them into each other with fixed actions
# - record actual contact-force-based collision metrics

env:
  num_envs: 1
  num_agents_per_env: 2
  observation_mode: "goal_reaching"
  env_spacing: 240.0
  spawn_height_m: 1.2
  ground_mode: "plane"
  # Keep the collision test on the simpler flat-world path so the video is validating
  # car-car contact and visible motion, not SceneFactory road rendering.
  use_scene_factory_roads: false
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  episode_length_s: 15.0
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  replicate_physics: true
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/multiworld_scene.yaml"
  world_index: 0

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_collision_test"
  run_name: "head_on"
  max_iterations: 1
  num_steps_per_env: 32
  save_interval: 1
  learning_rate: 3.0e-4
  num_learning_epochs: 1
  num_mini_batches: 1
  entropy_coef: 0.0
  clip_param: 0.2
  desired_kl: 0.01

test:
  mode: "collision_test"
  # Keep recording after the first detected contact so the clip shows the crash aftermath.
  post_collision_steps: 120
  post_collision_throttle: 0.0
  post_collision_steering: 0.0
  post_collision_brake: 1.0

video:
  enabled: true
  interval: 1
  length: 600
  name_prefix: "collision_test"
  width: 1280
  height: 720
  fps: 20
  view_mode: "single_env"
  env_index: 0

app:
  device: "cuda:0"
  rl_device: "cuda:0"
  silence_runtime_warnings: true

sim:
  use_fabric: true
