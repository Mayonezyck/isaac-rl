# Fastgoal-v6 "patient" variant — from scratch
#
# Goal: outperform V2's 76.8% eval SR by addressing its failure modes
# with principled, conservative reward rebalancing.
#
# Root-cause analysis of V2 failures (76.8% SR, 23.2% timeout):
#   1. 17/33 timeout worlds have agents <10 m from goal — ran out of time
#   2. idle_penalty (-0.82) cancels 110% of lane_reward (+0.74) per episode
#   3. route_progress (+1.36) is the only strong forward-motion signal
#   4. Mean throttle was 0.36 — agents are too cautious
#   5. Training was still improving at iter 1387 but stopped early (28% budget)
#
# Changes from V2 (each justified by data):
#   - episode_length_s:  40 → 45 s   (+12.5%, gives 150 more steps for near-goal agents)
#   - route_progress:    3.0 → 4.0   (+33%, strengthens the main forward signal)
#   - goal_bonus:        50 → 60     (+20%, stronger terminal magnet)
#   - idle_threshold:    2.0 → 2.5   (catches 2-2.5 m/s crawlers)
#   - idle_penalty/step: 0.08 → 0.06 (-25%, reduces lane_reward cancellation)
#   - max_iterations:    5000        (full budget — V2 only used 28%)
#
# Projected reward shift:
#   - Net per episode: 1.53 → 2.19 (+44%)
#   - Positive/negative ratio: 2.40 → 3.24
#   - idle_penalty cancellation: 110% → 95% of lane_reward
#
# What's NOT changed (working well in V2):
#   - All safety penalties (collision, crash, lane_forbidden, offroad, TTC)
#   - Policy architecture (late fusion)
#   - Observation config (road_points, neighbor, TTC)
#   - PPO hyperparameters (LR adaptive→0.01, clip=0.15, entropy=3e-5)
#   - Scene pool, num_envs, agent count

env:
  num_envs: 256
  num_agents_per_env: 16
  observation_mode: "choco_reference"
  env_spacing: 400.0
  spawn_height_m: 1.2
  spawn_yaw_noise_rad: 0.0
  ground_mode: "plane"
  use_scene_factory_roads: true
  reset_mode: "teleport_only"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  episode_length_s: 45.0                       # was 40.0 — 150 more steps for near-goal agents
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  goal_reached_threshold_m: 3.0
  fall_height_threshold_m: 0.0
  bad_tilt_gravity_threshold: -0.15
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/generated/scene_factory_256scene_curated_0326_train.yaml"
  world_index: 0
  world_selection_mode: "random_envs"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 350
  road_points_radius_m: 10.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: true
  neighbor_enable: true
  neighbor_k: 24
  neighbor_include_ttc: true
  neighbor_include_index: false
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

timing:
  step_log_enable: true
  step_print_enable: false
  step_print_every_n: 128
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 60.0                              # was 50.0 — stronger terminal magnet
  lane_center_enable: false
  lane_forbidden_enable: true
  lane_forbidden_penalty: -20.0
  collision_penalty: -6.0
  crash_penalty: -10.0
  choco_offroad_penalty: -0.5
  choco_idle_penalty_enable: true
  choco_idle_penalty_per_step: 0.06             # was 0.08 — softer, reduces lane_reward cancellation
  choco_idle_speed_threshold_mps: 2.5           # was 2.0 — catches 2-2.5 m/s crawlers
  choco_geom_lane_enable: true
  choco_geom_lane_per_step: 0.08
  choco_geom_lane_tolerance_m: 1.75
  choco_geom_lane_heading_weight: 0.8
  choco_geom_lane_min_alignment: 0.35
  choco_geom_route_progress_weight: 4.0         # was 3.0 — strongest forward signal boosted 33%
  choco_geom_offroad_enable: true
  choco_geom_offroad_lateral_threshold_m: 3.25
  choco_geom_offroad_distance_threshold_m: 6.0
  choco_ttc_penalty_enable: true
  choco_ttc_penalty_alpha: 0.10
  choco_ttc_penalty_max: 0.35
  choco_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_penalty_enable: true
  choco_road_edge_ttc_penalty_alpha: 0.07
  choco_road_edge_ttc_penalty_max: 0.40
  choco_road_edge_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_hard_min_ttc: 0.5
  choco_road_edge_ttc_radius_m: 40.0

policy:
  type: "late_fusion"
  ego_layers: [64, 64]
  road_layers: [96, 96]
  vehicle_layers: [96, 96]
  shared_layers: [128, 64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching_roads"
  run_name: "scene_factory_256scene_curated_0326_train_fastgoal_v6_patient"
  shared_policy_mode: "agent_slots"
  max_iterations: 5000
  num_steps_per_env: 128
  save_interval: 25
  learning_rate: 2.0924001030314093e-4          # will ramp to 0.01 via adaptive KL
  num_learning_epochs: 5
  num_mini_batches: 16
  entropy_coef: 3.0e-05
  clip_param: 0.15
  desired_kl: 0.01
  gamma: 0.99
  gae_lambda: 0.98

app:
  device: "cuda:1"
  rl_device: "cuda:1"
  silence_runtime_warnings: true

sim:
  use_fabric: false
