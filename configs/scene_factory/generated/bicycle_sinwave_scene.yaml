# Scene config for the bicycle sinwave demo.
# Uses 4 distinct Waymo road scenes so each env has different geometry.
# Friction is set to dry asphalt (baseline — weather irrelevant for bicycle model).
io:
  scene_json_dir: /home/yz8733/Github/isaac-rl/data/processed/waymo_scenes_json

world:
  root_container: /World/SceneFactoryWorlds
  world_count: 1
  grid_cols: 1
  rows: 1
  world_size_m: [200.0, 200.0]
  padding_m: 200.0
  base_z_m: 0.0
  bounds_size_m: 200.0
  origin_mode: center
  origin_center_mode: mean

  assignments:
    - scene_json: scene_000001.json
      friction:
        road_type: AC
        precip_type: clear
        precip_intensity_mmph: 0.0
        water_film_mm: 0.0

road:
  render_mode: point_instancer

vehicles:
  max_controllable_per_world: 4
