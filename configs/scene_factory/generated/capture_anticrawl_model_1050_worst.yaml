# Capture config — WORST scene (scene_000161.json, 0% SR)
# Runs eval on a single scene with video recording enabled.

env:
  num_envs: 1
  num_agents_per_env: 16
  observation_mode: "choco_reference"
  env_spacing: 400.0
  spawn_height_m: 1.2
  spawn_yaw_noise_rad: 0.0
  ground_mode: "plane"
  use_scene_factory_roads: true
  reset_mode: "teleport_only"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  episode_length_s: 50.0
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  goal_reached_threshold_m: 3.0
  fall_height_threshold_m: 0.0
  bad_tilt_gravity_threshold: -0.15
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/generated/scene_factory_1scene_worst_161.yaml"
  world_index: 0
  world_selection_mode: "fixed"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 350
  road_points_radius_m: 10.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: true
  neighbor_enable: true
  neighbor_k: 24
  neighbor_include_ttc: true
  neighbor_include_index: false
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

timing:
  step_log_enable: true
  step_print_enable: false
  step_print_every_n: 128
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 50.0
  lane_center_enable: false
  lane_forbidden_enable: true
  lane_forbidden_penalty: -20.0
  collision_penalty: -6.0
  crash_penalty: -10.0
  choco_offroad_penalty: -0.5
  choco_idle_penalty_enable: true
  choco_idle_penalty_per_step: 0.08
  choco_idle_speed_threshold_mps: 2.0
  choco_geom_lane_enable: true
  choco_geom_lane_per_step: 0.08
  choco_geom_lane_tolerance_m: 1.75
  choco_geom_lane_heading_weight: 0.8
  choco_geom_lane_min_alignment: 0.35
  choco_geom_route_progress_weight: 3.0
  choco_geom_offroad_enable: true
  choco_geom_offroad_lateral_threshold_m: 3.25
  choco_geom_offroad_distance_threshold_m: 6.0
  choco_ttc_penalty_enable: true
  choco_ttc_penalty_alpha: 0.10
  choco_ttc_penalty_max: 0.35
  choco_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_penalty_enable: true
  choco_road_edge_ttc_penalty_alpha: 0.07
  choco_road_edge_ttc_penalty_max: 0.40
  choco_road_edge_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_hard_min_ttc: 0.5
  choco_road_edge_ttc_radius_m: 40.0

policy:
  type: "late_fusion"
  ego_layers: [64, 64]
  road_layers: [96, 96]
  vehicle_layers: [96, 96]
  shared_layers: [128, 64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching_eval"
  run_name: "capture_worst_scene161_anticrawl_model1050"
  shared_policy_mode: "agent_slots"
  max_iterations: 1
  num_steps_per_env: 128
  save_interval: 1
  learning_rate: 2.0924001030314093e-4
  num_learning_epochs: 5
  num_mini_batches: 16
  entropy_coef: 3.0e-05
  clip_param: 0.15
  desired_kl: 0.01
  gamma: 0.99
  gae_lambda: 0.98

test:
  mode: "scene_factory_policy_eval"
  checkpoint_path: "logs/rsl_rl/scene_factory_goal_reaching_roads/2026-04-06_12-46-16_scene_factory_256scene_curated_0326_train_fastgoal_v2_anticrawl/model_1050.pt"
  max_steps: 0
  invincible: true

video:
  enabled: true
  interval: 1
  length: 1500
  name_prefix: "capture_worst_scene161"
  width: 1920
  height: 1080
  fps: 30
  step_stride: 1
  view_mode: "single_env"
  env_index: 0
  vehicle_proxy_markers: true
  vehicle_proxy_z_offset_m: 0.35

app:
  device: "cuda:0"
  rl_device: "cuda:0"
  silence_runtime_warnings: true

sim:
  use_fabric: false
