# Fastgoal-v3 "anti-crawl aggressive" variant
#
# Based on: v2 anticrawl (model_1050 analysis shows mean throttle=0.36, zero brake)
#
# Diagnosis: policy learned conservative 36% throttle because penalty fear > progress reward.
# Route progress at 5 m/s gives ~0.5/step while idle penalty is only 0.08/step.
# The agent found a local optimum: go slow enough to avoid collisions, earn some progress.
#
# V3 changes (vs v2):
#   - idle speed threshold:       2.0 → 5.0 m/s  (18 km/h — anything below is penalized)
#   - idle penalty per step:      0.08 → 0.25     (massive penalty for crawling)
#   - route progress weight:      3.0 → 6.0       (double the forward-motion incentive)
#   - goal bonus:                 50.0 → 60.0     (bigger carrot for reaching goal)
#   - collision penalty:          -6.0 → -3.0     (halved — don't be so scared)
#   - lane_forbidden penalty:     -20.0 → -10.0   (halved — wrong lane not as scary)
#   - crash penalty:              -10.0 → -5.0    (halved)
#   - offroad penalty:            -0.5 → -0.3     (lighter)
#   - episode length:             40.0 → 35.0 s   (even more urgency)
#   - max_iterations:             5000 → 5000     (same budget)
#   - resume from v2 model_1050                    (warm-start, don't waste 1050 iters)
#
# The idea: make crawling hurt SO much that the only way to get positive reward is
# to actually drive at reasonable speed, while reducing fear of penalties.

env:
  num_envs: 256
  num_agents_per_env: 16
  observation_mode: "choco_reference"
  env_spacing: 400.0
  spawn_height_m: 1.2
  spawn_yaw_noise_rad: 0.0
  ground_mode: "plane"
  use_scene_factory_roads: true
  reset_mode: "teleport_only"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  episode_length_s: 35.0                         # was 40.0 — even tighter deadline
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  goal_reached_threshold_m: 3.0
  fall_height_threshold_m: 0.0
  bad_tilt_gravity_threshold: -0.15
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/generated/scene_factory_256scene_curated_0326_train.yaml"
  world_index: 0
  world_selection_mode: "random_envs"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 350
  road_points_radius_m: 10.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: true
  neighbor_enable: true
  neighbor_k: 24
  neighbor_include_ttc: true
  neighbor_include_index: false
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

timing:
  step_log_enable: true
  step_print_enable: false
  step_print_every_n: 128
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 60.0                                # was 50.0 — bigger carrot
  lane_center_enable: false
  lane_forbidden_enable: true
  lane_forbidden_penalty: -10.0                   # was -20.0 — halved (less fear)
  collision_penalty: -3.0                         # was -6.0  — halved (less fear)
  crash_penalty: -5.0                             # was -10.0 — halved (less fear)
  choco_offroad_penalty: -0.3                     # was -0.5  — lighter
  choco_idle_penalty_enable: true
  choco_idle_penalty_per_step: 0.25               # was 0.08 — 3× stronger
  choco_idle_speed_threshold_mps: 5.0             # was 2.0  — 18 km/h floor
  choco_geom_lane_enable: true
  choco_geom_lane_per_step: 0.08
  choco_geom_lane_tolerance_m: 1.75
  choco_geom_lane_heading_weight: 0.8
  choco_geom_lane_min_alignment: 0.35
  choco_geom_route_progress_weight: 6.0           # was 3.0 — 2× stronger
  choco_geom_offroad_enable: true
  choco_geom_offroad_lateral_threshold_m: 3.25
  choco_geom_offroad_distance_threshold_m: 6.0
  choco_ttc_penalty_enable: true
  choco_ttc_penalty_alpha: 0.10
  choco_ttc_penalty_max: 0.35
  choco_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_penalty_enable: true
  choco_road_edge_ttc_penalty_alpha: 0.07
  choco_road_edge_ttc_penalty_max: 0.40
  choco_road_edge_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_hard_min_ttc: 0.5
  choco_road_edge_ttc_radius_m: 40.0

policy:
  type: "late_fusion"
  ego_layers: [64, 64]
  road_layers: [96, 96]
  vehicle_layers: [96, 96]
  shared_layers: [128, 64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching_roads"
  run_name: "scene_factory_256scene_curated_0326_train_fastgoal_v3_anticrawl_aggressive"
  shared_policy_mode: "agent_slots"
  max_iterations: 5000
  num_steps_per_env: 128
  save_interval: 25
  resume_path: "logs/rsl_rl/scene_factory_goal_reaching_roads/2026-04-06_12-46-16_scene_factory_256scene_curated_0326_train_fastgoal_v2_anticrawl/model_1375.pt"
  learning_rate: 2.0924001030314093e-4
  num_learning_epochs: 5
  num_mini_batches: 16
  entropy_coef: 3.0e-05
  clip_param: 0.15
  desired_kl: 0.01
  gamma: 0.99
  gae_lambda: 0.98

app:
  device: "cuda:0"
  rl_device: "cuda:0"
  silence_runtime_warnings: true

sim:
  use_fabric: false
