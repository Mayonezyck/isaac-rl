# SceneFactory multi-agent goal-reaching training preset.
# This file is consumed directly by:
#   python -m src.train_student_vehicle_goal_multiagent_rsl_rl --config <this-file>
#
# Philosophy:
# - Goal-centric observation only.
# - No wheel/steer/gravity/neighbor terms in the policy observation.
# - Large logical worlds so agents learn long-horizon point-to-point driving.

env:
  # Parallel Isaac Lab worlds.
  num_envs: 32
  # Vehicles per world.
  num_agents_per_env: 6
  # Minimal trainable observation:
  # goal(x,y), distance, body-frame (vx, vy), yaw_rate.
  observation_mode: "goal_reaching"
  # World layout / reset.
  env_spacing: 240.0
  spawn_height_m: 1.6
  ground_mode: "plane"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 20.0
  agent_spawn_jitter_m: 0.25
  episode_length_s: 40.0
  # Goal sampling radius.
  goal_radius_min_m: 35.0
  goal_radius_max_m: 80.0
  # Logical world radius for crash / out-of-bounds checks.
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  replicate_physics: true
  clone_in_fabric: "auto"

assets:
  # Current controllable student vehicle asset.
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  # Current best tuned dynamics from sysid.
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching"
  run_name: "goal_obs_only"
  max_iterations: 300
  num_steps_per_env: 32
  save_interval: 25
  learning_rate: 3.0e-4
  num_learning_epochs: 5
  num_mini_batches: 4
  entropy_coef: 0.005
  clip_param: 0.2
  desired_kl: 0.01

app:
  # Use CUDA-visible device 0 from the current process namespace.
  device: "cuda:0"
  rl_device: "cuda:0"
