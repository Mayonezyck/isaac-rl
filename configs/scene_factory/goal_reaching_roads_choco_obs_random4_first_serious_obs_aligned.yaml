# SceneFactory observation-aligned variant of the first serious road-goal-reaching preset.
#
# This preserves the original preset and makes the observation-contract edits in a
# separate file so config evolution stays traceable.
#
# Changes vs. `goal_reaching_roads_choco_obs_random4_first_serious.yaml`:
# - align `choco_reference` observation layout with the older Chocolate contract
# - road points use the older Stage1/2-style density and ordering
# - neighbor block uses the older Chocolate-style feature set (no TTC, no index)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=1 PYTHONUNBUFFERED=1 conda run -n isaac-pytorch python -u \
#     -m src.train_student_vehicle_goal_multiagent_rsl_rl \
#     --config configs/scene_factory/goal_reaching_roads_choco_obs_random4_first_serious_obs_aligned.yaml \
#     --headless

env:
  num_envs: 4
  num_agents_per_env: 4
  observation_mode: "choco_reference"
  env_spacing: 240.0
  spawn_height_m: 1.2
  ground_mode: "plane"
  use_scene_factory_roads: true
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.05
  episode_length_s: 40.0
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/multiworld_scene_video.yaml"
  world_index: 0
  world_selection_mode: "random_envs"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 200
  road_points_radius_m: 35.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: false
  neighbor_enable: true
  neighbor_k: 63
  neighbor_include_ttc: false
  neighbor_include_index: false
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

reward:
  lane_center_enable: true
  lane_center_types: [1, 2]
  lane_center_per_step: 0.05
  lane_forbidden_enable: true
  lane_forbidden_types: [15, 16]
  lane_forbidden_penalty: -30.0

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_only_smoke/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/fwd_v1_staged_cem_anchor_overnight/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "scene_factory_goal_reaching_roads"
  run_name: "random4_first_serious_obs_aligned"
  max_iterations: 40000
  num_steps_per_env: 32
  save_interval: 25
  learning_rate: 3.0e-4
  num_learning_epochs: 5
  num_mini_batches: 4
  entropy_coef: 0.005
  clip_param: 0.2
  desired_kl: 0.01

app:
  device: "cuda:0"
  rl_device: "cuda:0"
  silence_runtime_warnings: true

sim:
  use_fabric: false
