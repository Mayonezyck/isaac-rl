choco_config_path: "configs/curriculum_design/stage2_navigation_discipline/curriculum_stage2_navigation_discipline.yaml"

device: "cuda:1"

reward_type: "weighted_combination"
collision_weight: -1.0
goal_achieved_weight: 1.0
off_road_weight: 0.0
log_distance_weight: 0.0
policy_type: "late_fusion"

late_fusion:
  ego_dim: 11
  point_dim: 3
  point_k: null
  ego_layers: [64, 64]
  point_layers: [64, 64]
  shared_layers: [64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  act: "relu"
  dropout: 0.0
  pool: "max"

seed: 42
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
vf_coef: 0.5
n_steps: 64
num_minibatches: 8
verbose: 1
total_timesteps: 10_000_000
ent_coef: 0.0001
lr: 0.0003
n_epochs: 5

render_every_updates: 1000
render_rollout_steps: 0
render_dir: "runs/capture_stage2_navigation_discipline"
render_during_training: false
record_training_video: false
video_fps: 30
video_name_prefix: "ppo_stage2_navigation_discipline"
video_keep_frames: false

save_freq: 20000
save_dir: "runs/checkpoints_stage2_navigation_discipline"
save_prefix: "ppo_stage2_navigation_discipline"
resume_from: null
