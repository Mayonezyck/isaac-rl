road:
  jump_break_m: 3.0
  seg_width: 0.10
  seg_height: 0.01
  z_lift: 0.02
  flatten_road_z: true
  road_z_m: 0.0
  polyline_reduction_area: 0.0
  min_points_for_reduction: 10
  enable_segment_collision: false
  trigger_enable: true
  trigger_height_m: 1.0
  trigger_width_scale: 1.0
  trigger_offset_z_m: 1.2
  trigger_match_segment: true
  trigger_script_enable: true

agents:
  spawn_z_m: 0.7
  goal_radius_m: 3.0
  parked_if_start_in_goal: true
  skip_if_start_in_goal: true
  start_goal_thresh_m: 10.0
  parked_ground_z_m: 0.0
  parked_chassis_size_m: [4.0, 2.0, 1.0]
  parked_wheel_radius_m: 0.35
  parked_wheel_thickness_m: 0.15
  parked_wheel_inset_x_m: 0.6
  parked_wheel_inset_y_m: 0.05
  parked_ground_clearance_m: 0.25
  goal_ring_z_m: 0.0
  goal_ring_tube_radius_m: 0.12
  goal_trigger_height_m: 0.6
  vehicle_trigger_enable: true
  vehicle_trigger_offset_m: [0.0, 0.0, 0.5]
  vehicle_trigger_size_m: [4.5, 2.5, 0.4]
  vehicle_trigger_script_enable: true

physics:
  warmup_frames: 30
  capture_frames: 6000
  physics_substeps_per_frame: 1
  enable_gpu_dynamics: true
  broadphase_type: "GPU"
  enable_ccd: false
  report_gpu_dynamics_once: true

ground:
  enable: true
  mode: "per_world"
  size_m: [200.0, 200.0]
  thickness_m: 0.2
  z_m: 0.0
  invisible: true
  friction_values: [0.50]
  friction_pipeline:
    enable: true
    defaults:
      tire_model_id: "zhao2024_modified_all_default"
      v_ref_mps: 13.89
      s_ref_static: 0.15
      s_ref_dynamic: 0.8
      mu_eff_mode: "static"
  label:
    enable: false
    format: "{value:.2f}"
    corner: "top_right"
    margin_m: 8.0
    char_height_m: 8.0
    char_spacing_m: 1.5

light:
  enable: false
  path: "/World/__DomeLight"
  intensity: 3000.0
  exposure: 0.0
  texture_file: null
  rotation_deg_y: 0.0

camera:
  prim_path: "/World/CaptureCam"
  mode: pose
  pose:
    pos_units: [26.428, -1.383, 319.049]
    rot_axis: [0.021, -0.027, 1]
    rot_deg: 269.109
  print_every_n: 10
  height_m: 120.0
  look_at_z_m: 0.0
  focal_length: 24.0
  horiz_aperture: 20.955
  vert_aperture: 15.2908

control:
  enable: true
  action_repeat: 8
  thr_clip: [0.0, 0.55]
  steer_clip: [-1.0, 1.0]
  k_steer: 2.0
  k_thr: 0.8
  goal_success_dist_norm: 0.01
  speed_scale_mps: 10.0

env:
  max_steps: 500
  auto_reset_done: true
  auto_reset_timeout: true
  done_reset_mode: "world"
  mask_dead_agent_steps: true
  clear_on_done: true
  respawn_on_reset: true
  respawn_mode: "rebuild"
  respawn_hold_radius_m: 4.0
  startup_below_min_z_preflight_steps: 4
  render: false
  goal_success_dist_m: 3.0
  reward_scale: 1.25
  success_bonus: 8.0
  action_l2_penalty: 0.0
  collision_penalty: 0.0
  min_vehicle_z_m: -0.2
  collision_penalty_types: []
  collision_debug: false
  road_contact_done_types: [15, 16]
  road_contact_done_penalty: 0.0
  road_edge_latched_penalty_enable: true
  road_edge_latched_penalty_per_step: -20.0
  road_edge_latched_clear_types: [1, 2]
  lane_center_reward_enable: false
  lane_center_reward_type: [1, 2]
  lane_center_reward_per_step: 0.0
  geom_lane_reward_enable: true
  geom_lane_reward_per_step: 0.12
  geom_lane_tolerance_m: 1.75
  geom_lane_heading_weight: 0.8
  geom_lane_min_alignment: 0.35
  geom_route_progress_weight: 0.2
  geom_offroad_metrics_enable: true
  geom_offroad_lateral_threshold_m: 3.25
  geom_offroad_distance_threshold_m: 6.0
  geom_lane_types: [1, 2]
  geom_road_edge_types: [15, 16]
  survival_reward_per_step: 0.0
  idle_penalty_enable: true
  idle_penalty_per_step: 0.03
  idle_speed_threshold_mps: 0.5
  vehicle_contact_done: false
  vehicle_contact_done_penalty: 0.0
  vehicle_contact_done_mark_both: false
  road_contact_debug: false
  road_contact_debug_every: 100
  road_points_enable: true
  road_points_k: 350
  road_points_mode: "road_running"
  road_points_include_dirs: true
  road_points_radius_m: 10.0
  road_points_type_norm: 20.0
  vehicle_obs_enable: true
  vehicle_obs_k: 24
  ttc_penalty_enable: true
  ttc_penalty_alpha: 0.15
  ttc_penalty_max: 0.50
  ttc_penalty_min_ttc: 0.5
  ttc_penalty_function: "proximity_zuo"
  ttc_proximity_zuo_a: 2.0
  ttc_proximity_zuo_b: 5.0
  road_edge_ttc_penalty_enable: true
  road_edge_ttc_penalty_alpha: 0.10
  road_edge_ttc_penalty_max: 0.60
  road_edge_ttc_penalty_min_ttc: 0.5
  road_edge_ttc_hard_min_ttc: 0.5
  road_edge_ttc_radius_m: 40.0
  road_edge_ttc_penalty_function: "proximity_zuo"
  road_edge_ttc_proximity_zuo_a: 0.5
  road_edge_ttc_proximity_zuo_b: 5.0
  ttc_delta_penalty_enable: false
  ttc_delta_penalty_alpha: 0.0
  ttc_delta_penalty_max: 0.5
  ttc_delta_penalty_normalize_by_dt: false
  ttc_use_vehicle_size: true
  ttc_vehicle_radius_scale: 0.75
  ttc_vehicle_radius_margin_m: 0.20
  obs_vis_enable: false
  obs_vis_every_steps: 2000
  obs_vis_out_dir: "runs/obs_vis"
  obs_vis_agent_index: 0
  obs_viz_enable: false
  obs_viz_world_idx: 0
  obs_viz_agent_rank: 0
  verbose: false
