app:
  headless: true
  renderer: "RayTracedLighting"
  active_gpu: 1
  physics_gpu: 1

io:
  scene_json_dir: "/home/yz8733/Github/isaac-rl/data/processed/waymo_scenes_json"
  out_dir: "/home/yz8733/Github/isaac-rl/_captures_300"
  take_first_k_scenes: 120
  image_prefix: "frame_"
  image_ext: "png"

world:
  root_container: "/World/MiniWorlds"
  world_count: 64
  grid_cols: 8
  rows: 8
  world_size_m: [200.0, 200.0]
  padding_m: 100.0
  base_z_m: 0.0
  bounds_size_m: 200.0
  origin_mode: "center"
  max_agents_per_world: 16
  assignments:
