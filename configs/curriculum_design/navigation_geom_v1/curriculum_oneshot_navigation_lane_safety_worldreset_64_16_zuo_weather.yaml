      friction: &wx_clear {road_type: "AC", precip_type: "clear", precip_intensity_mmph: 0.0, water_film_mm: 0.0}
    - scene_json: "scene_000114.json"
      friction: &wx_drizzle {road_type: "AC", precip_type: "drizzle", precip_intensity_mmph: 0.3, water_film_mm: 0.015}
