study:
  name: "stage1_currentmaps_old_strategy_smoke_cpu"
  output_root: "runs/hparam_search/stage1_currentmaps_old_strategy_smoke_cpu"

base:
  ppo_config: "configs/curriculum_design/stage1_controlled_experiments/ppo_stage1_currentmaps_old_strategy.yaml"

runner:
  command_prefix: ["python", "-u"]
  train_entry: "gpudrive_chocolate/baselines/ppo/ppo_sb3.py"

resources:
  max_parallel: 1
  auto_expand_slots: true
  slots:
    - label: "cpu_policy_gpu_sim"
      device: "cpu"
      active_gpu: 1
      physics_gpu: 1

search:
  random_seed: 7
  generations: 2
  population_size: 2
  elite_count: 1
  mutation_rate: 0.35
  crossover_rate: 0.75
  random_candidates_per_generation: 1
  metric_window: 3
  timesteps_per_trial: 4096
  heartbeat_sec: 5

scoring:
  primary_metric: "rollout/success_rate"
  missing_value: 0.0
  weights:
    rollout/success_rate: 100.0
    rollout/goal_rate: 35.0
    rollout/mean_dist_to_goal_m: -0.60
    rollout/road_contact_done_rate: -25.0
    rollout/vehicle_contact_done_rate: -10.0
    rollout/below_min_z_rate: -50.0
    rollout/mean_episode_len: 0.05

space:
  - name: "lr"
    target: "ppo"
    path: "lr"
    type: "float"
    min: 0.00015
    max: 0.0006
    scale: "log"
  - name: "ent_coef"
    target: "ppo"
    path: "ent_coef"
    type: "choice"
    values: [0.0, 0.00005, 0.0001]
  - name: "n_steps"
    target: "ppo"
    path: "n_steps"
    type: "choice"
    values: [64, 128]
  - name: "num_minibatches"
    target: "ppo"
    path: "num_minibatches"
    type: "choice"
    values: [4, 8]
  - name: "goal_achieved_weight"
    target: "ppo"
    path: "goal_achieved_weight"
    type: "choice"
    values: [0.5, 1.0, 2.0]
  - name: "reward_scale"
    target: "curriculum"
    path: "env.reward_scale"
    type: "choice"
    values: [1.0, 1.5, 2.0]
  - name: "success_bonus"
    target: "curriculum"
    path: "env.success_bonus"
    type: "choice"
    values: [8.0, 12.0, 16.0]
  - name: "thr_clip_max"
    target: "curriculum"
    path: "control.thr_clip.1"
    type: "choice"
    values: [0.35, 0.40, 0.50]
