study:
  name: "stage2_lane_safety_geom_roadedge_ttc_quick_from_stage1_3m"
  output_root: "runs/hparam_search/stage2_lane_safety_geom_roadedge_ttc_quick_from_stage1_3m"

base:
  ppo_config: "configs/curriculum_design/navigation_geom_v1/ppo_stage2_lane_safety_geom_roadedge_ttc_from_stage1_3m.yaml"

runner:
  command_prefix: ["python", "-u"]
  train_entry: "gpudrive_chocolate/baselines/ppo/ppo_sb3.py"

resources:
  max_parallel: 8
  auto_expand_slots: true
  slots:
    - label: "gpu1_a"
      device: "cuda:1"
      active_gpu: 1
      physics_gpu: 1
    - label: "gpu1_b"
      device: "cuda:1"
      active_gpu: 1
      physics_gpu: 1

search:
  random_seed: 123
  preserve_resume_from: true
  generations: 3
  population_size: 12
  elite_count: 4
  mutation_rate: 0.35
  crossover_rate: 0.80
  random_candidates_per_generation: 4
  metric_window: 6
  timesteps_per_trial: 196608
  heartbeat_sec: 8

scoring:
  primary_metric: "rollout/success_rate"
  missing_value: 0.0
  weights:
    rollout/success_rate: 160.0
    rollout/goal_rate: 45.0
    rollout/mean_dist_to_goal_m: -1.0
    rollout/mean_lane_error_m: -15.0
    rollout/mean_heading_alignment: 20.0
    rollout/mean_route_progress_m: 28.0
    rollout/lane_hit_rate: -18.0
    rollout/off_road_rate: -60.0
    rollout/collision_rate: -90.0
    rollout/road_collision_rate: -40.0
    rollout/vehicle_collision_rate: -90.0
    rollout/road_contact_done_rate: -120.0
    rollout/vehicle_contact_done_rate: -150.0
    rollout/below_min_z_rate: -180.0
    rollout/mean_episode_len: 0.02

space:
  - name: "lr"
    target: "ppo"
    path: "lr"
    type: "float"
    min: 0.00008
    max: 0.0004
    scale: "log"
  - name: "ent_coef"
    target: "ppo"
    path: "ent_coef"
    type: "choice"
    values: [0.0, 0.00003, 0.00005, 0.0001, 0.0003]
  - name: "clip_range"
    target: "ppo"
    path: "clip_range"
    type: "choice"
    values: [0.10, 0.15, 0.20, 0.25]
  - name: "gamma"
    target: "ppo"
    path: "gamma"
    type: "choice"
    values: [0.99, 0.995]
  - name: "gae_lambda"
    target: "ppo"
    path: "gae_lambda"
    type: "choice"
    values: [0.95, 0.98]
  - name: "n_steps"
    target: "ppo"
    path: "n_steps"
    type: "choice"
    values: [64, 128]
  - name: "num_minibatches"
    target: "ppo"
    path: "num_minibatches"
    type: "choice"
    values: [4, 8, 16]
  - name: "collision_weight"
    target: "ppo"
    path: "collision_weight"
    type: "choice"
    values: [-0.05, -0.10, -0.20]
  - name: "off_road_weight"
    target: "ppo"
    path: "off_road_weight"
    type: "choice"
    values: [-0.05, -0.10, -0.20]
  - name: "reward_scale"
    target: "curriculum"
    path: "env.reward_scale"
    type: "choice"
    values: [0.5, 0.6, 0.8, 1.0]
  - name: "success_bonus"
    target: "curriculum"
    path: "env.success_bonus"
    type: "choice"
    values: [8.0, 10.0, 12.0, 16.0]
  - name: "thr_clip_max"
    target: "curriculum"
    path: "control.thr_clip.1"
    type: "choice"
    values: [0.45, 0.55, 0.65]
  - name: "geom_lane_reward_per_step"
    target: "curriculum"
    path: "env.geom_lane_reward_per_step"
    type: "choice"
    values: [0.08, 0.12, 0.16]
  - name: "geom_lane_tolerance_m"
    target: "curriculum"
    path: "env.geom_lane_tolerance_m"
    type: "choice"
    values: [1.25, 1.5, 1.75]
  - name: "geom_lane_heading_weight"
    target: "curriculum"
    path: "env.geom_lane_heading_weight"
    type: "choice"
    values: [0.5, 0.7, 0.9]
  - name: "geom_lane_min_alignment"
    target: "curriculum"
    path: "env.geom_lane_min_alignment"
    type: "choice"
    values: [0.35, 0.45, 0.55]
  - name: "geom_route_progress_weight"
    target: "curriculum"
    path: "env.geom_route_progress_weight"
    type: "choice"
    values: [0.25, 0.40, 0.55]
  - name: "collision_penalty"
    target: "curriculum"
    path: "env.collision_penalty"
    type: "choice"
    values: [-0.1, -0.2, -0.4]
  - name: "road_contact_done_penalty"
    target: "curriculum"
    path: "env.road_contact_done_penalty"
    type: "choice"
    values: [-4.0, -6.0, -8.0]
  - name: "vehicle_contact_done_penalty"
    target: "curriculum"
    path: "env.vehicle_contact_done_penalty"
    type: "choice"
    values: [-6.0, -8.0, -10.0]
  - name: "ttc_penalty_alpha"
    target: "curriculum"
    path: "env.ttc_penalty_alpha"
    type: "choice"
    values: [0.10, 0.15, 0.25, 0.35]
  - name: "ttc_penalty_max"
    target: "curriculum"
    path: "env.ttc_penalty_max"
    type: "choice"
    values: [0.50, 0.75, 1.0]
  - name: "ttc_penalty_min_ttc"
    target: "curriculum"
    path: "env.ttc_penalty_min_ttc"
    type: "choice"
    values: [0.4, 0.5, 0.7]
  - name: "road_edge_ttc_penalty_enable"
    target: "curriculum"
    path: "env.road_edge_ttc_penalty_enable"
    type: "choice"
    values: [true]
  - name: "road_edge_ttc_penalty_alpha"
    target: "curriculum"
    path: "env.road_edge_ttc_penalty_alpha"
    type: "choice"
    values: [0.05, 0.10, 0.15, 0.25]
  - name: "road_edge_ttc_penalty_max"
    target: "curriculum"
    path: "env.road_edge_ttc_penalty_max"
    type: "choice"
    values: [0.40, 0.60, 0.80]
  - name: "road_edge_ttc_penalty_min_ttc"
    target: "curriculum"
    path: "env.road_edge_ttc_penalty_min_ttc"
    type: "choice"
    values: [0.4, 0.5, 0.7]
  - name: "road_edge_ttc_hard_min_ttc"
    target: "curriculum"
    path: "env.road_edge_ttc_hard_min_ttc"
    type: "choice"
    values: [0.3, 0.5, 0.7]
  - name: "road_edge_ttc_radius_m"
    target: "curriculum"
    path: "env.road_edge_ttc_radius_m"
    type: "choice"
    values: [30.0, 40.0, 50.0]
  - name: "ttc_delta_penalty_enable"
    target: "curriculum"
    path: "env.ttc_delta_penalty_enable"
    type: "choice"
    values: [false, true]
  - name: "ttc_delta_penalty_alpha"
    target: "curriculum"
    path: "env.ttc_delta_penalty_alpha"
    type: "choice"
    values: [0.0, 0.05, 0.10, 0.20]
  - name: "ttc_delta_penalty_max"
    target: "curriculum"
    path: "env.ttc_delta_penalty_max"
    type: "choice"
    values: [0.25, 0.5, 0.75]
  - name: "ttc_delta_penalty_normalize_by_dt"
    target: "curriculum"
    path: "env.ttc_delta_penalty_normalize_by_dt"
    type: "choice"
    values: [false, true]
  - name: "max_steps"
    target: "curriculum"
    path: "env.max_steps"
    type: "choice"
    values: [450, 550, 650]
